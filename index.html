<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="C1 Workout">
<meta name="theme-color" content="#eef0ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141819" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%;background:var(--bg,#eef0ee)}body{margin:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}</style>
<title>C1 Week 1 Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: a training card — day tabs on top, one column of exercise rows with set tick-boxes, a rest timer docked at the bottom */
:root{
  --bg:#eef0ee; --card:#ffffff; --ink:#1d2327; --muted:#5e686d; --line:#d6dbd9;
  --accent:#c2410c; --accent-ink:#ffffff; --done:#2f7d4f;
  --push:#d9468f; --abs:#e07a3f; --pull:#3f9a55; --leg:#2f86c4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141819; --card:#1d2224; --ink:#e8ecea; --muted:#9aa5a8; --line:#2f3739;
  --accent:#f97333; --accent-ink:#1a0d05; --done:#5cc184;
  --push:#ef6aa9; --abs:#f2955c; --pull:#62c27a; --leg:#5aaee6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141819; --card:#1d2224; --ink:#e8ecea; --muted:#9aa5a8; --line:#2f3739;
  --accent:#f97333; --accent-ink:#1a0d05; --done:#5cc184;
  --push:#ef6aa9; --abs:#f2955c; --pull:#62c27a; --leg:#5aaee6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .eyebrow{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;font-size:14px}
h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px}
.week{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.week a{flex:1 0 auto;min-width:78px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.week a small{font-size:11px;color:var(--muted);font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.week a span{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1}
.week a[aria-current="true"]{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.week a.rest{opacity:.6;pointer-events:none}
.week a .bar{height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.week a .bar i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
section.block{margin-bottom:22px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bhead h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;display:flex;align-items:center;gap:10px}
.bhead h2::before{content:"";width:10px;height:26px;border-radius:3px;background:var(--c)}
.warm{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:5px 10px;border-radius:999px}
.warm:hover{border-color:var(--c)}
.note{font-size:13px;color:var(--muted);margin:0 0 8px}
ol.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px}
ol.list li{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:start}
ol.list li:first-child{border-top:0}
.n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.name{font-weight:600;min-width:0}
.name.done{color:var(--done)}
.meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.vid{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.vid:hover{text-decoration:underline}
.sets{grid-column:2/4;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sets button{font:600 14px var(--display);letter-spacing:.04em;min-width:58px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.sets button[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--card)}
.sets button:focus-visible,.rest-btn:focus-visible,.week a:focus-visible,.timer button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rest-btn{font:500 12px var(--body);background:none;border:1px dashed var(--line);color:var(--muted);border-radius:8px;height:38px;padding:0 10px;cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.foot button{font:500 13px var(--body);background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer}
.reset-confirm{display:inline-flex;gap:6px;align-items:center}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;gap:14px;align-items:center;z-index:5}
.timer .t{font:800 34px var(--display);font-variant-numeric:tabular-nums;min-width:90px;text-align:center}
.timer .lbl{font-size:12px;opacity:.75;max-width:160px}
.timer button{font:600 13px var(--body);background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:8px;padding:6px 12px;cursor:pointer}
.timer.up .t{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow">C1 · Week 1</div>
    <h1 id="dayTitle">Push Day</h1>
    <p class="sub" id="daySub"></p>
  </header>
  <nav class="week" id="week" aria-label="Week schedule"></nav>
  <main id="main"></main>
  <div class="foot">
    <span>Tap a set when you finish it. Progress is saved on this device.</span>
    <span id="resetArea"><button id="resetBtn" type="button">Reset this day</button></span>
  </div>
</div>
<div class="timer" id="timer" hidden>
  <div class="lbl" id="timerLbl">Rest</div>
  <div class="t" id="timerT">0:00</div>
  <button type="button" id="timerAdd">+30s</button>
  <button type="button" id="timerStop">Done</button>
</div>

<script>
const Y=id=>"https://youtu.be/"+id;
const W_PUSH=Y("5s6RPJwTNBc?si=ETncuUgcvWN50zuV");
const pushEx=sets=>[
  {n:"Dip",reps:"3–5 ครั้ง",sets:3,rest:"3:00–5:00",sec:180,v:Y("1e7nKhGvnQQ?si=TtoyzFl_jk5jt6Dm")},
  {n:"Retract scapular pike push up",reps:"8–12 ครั้ง",sets,rest:"2:00",sec:120,v:Y("GK_neUhsVdA?si=2pRlK9Aa3-gqKAii")},
  {n:"Skull crusher",reps:"10–12 ครั้ง",sets,rest:"2:00",sec:120,v:Y("Ujqqm65d0us?si=nr2-hNKrvzdYyZMR")},
  {n:"Push up",reps:"12–15 ครั้ง",sets,rest:"1:50",sec:110,v:Y("-5l_dcFY26Q?si=rW3n6gYZb--SEHY3")},
  {n:"Scapular push-up",reps:"20 ครั้ง",sets,rest:"1:50",sec:110,v:Y("c_d70dOf5No?si=9NII3E7Is8ylH8YH")}
];
const DAYS=[
  {id:"push-1",short:"Day 1",title:"Push Day",blocks:[
    {name:"Push Day",c:"--push",warm:W_PUSH,ex:pushEx(4)}]},
  {id:"abs",short:"Day 2",title:"Abs Day",blocks:[
    {name:"Abs",c:"--abs",warm:Y("6sH8MsYVhmY?si=W8F01vZ_iJ6rcdUt"),ex:[
      {n:"Hanging L-sit hold",reps:"10–15 วิ",sets:4,rest:"3:00",sec:180,v:Y("4SFqyK0uOyQ?si=MbT3hw_2ZBMpPQBp")},
      {n:"Leg raise on parallel bar",reps:"8–12 ครั้ง",sets:4,rest:"2:00",sec:120,v:Y("Jwfd3P83trs?si=08TnfqW1Q1uSQ2ty")},
      {n:"Hollow body hold",note:"เก็บมือไว้ข้างลำตัว",reps:"30 วิ",sets:4,rest:"1:50",sec:110,v:Y("Tt_NcZYdoIQ")},
      {n:"Reach up",reps:"15 ครั้ง",sets:3,rest:"1:50",sec:110,v:Y("2U-g6v09gmU?si=-p36uGzKDhsizLyv")},
      {n:"Double star crunch",reps:"16 ครั้ง",sets:3,rest:"1:50",sec:110,v:Y("nb_E3be-h9A?si=BQXMV2sdxtLGYK9n")},
      {n:"Heel touch side to side",reps:"16–20 ครั้ง",sets:3,rest:"1:50",sec:110,v:Y("PTJupQGLbT0?si=JFqKmL8cgNFcwoXO")}
    ]}]},
  {id:"rest",short:"Rest",title:"พัก",rest:true},
  {id:"pull",short:"Day 3",title:"Pull Day",blocks:[
    {name:"Pull Day",c:"--pull",warm:W_PUSH,ex:[
      {n:"Jump muscle up",reps:"10 ครั้ง",sets:3,rest:"2:00–3:00",sec:120,v:Y("5GoH-Ck6i2I?si=cXo7E4_k83e0O-Z4")},
      {n:"Negative pull-up",reps:"6–8 ครั้ง",sets:4,rest:"2:00–3:00",sec:120,v:Y("asvMf5zVnB0?si=Ee7VfiXQWdO-kunF")},
      {n:"Seated cable row",note:"ครึ่ง นน.ตัว → เท่า นน.ตัว",reps:"8–12 ครั้ง",sets:4,rest:"1:50",sec:110,v:Y("UCXxvVItLoM?si=BwPoXKs7iJoi9OdO")},
      {n:"Lateral raise",note:"2.5 kg, 5 kg",reps:"8–12 ครั้ง",sets:4,rest:"1:50",sec:110,v:Y("pOmbQuGeHf8?si=WNtRWSduTrV24Ji7")},
      {n:"Bicep curls",note:"5, 7.5, 10 kg",reps:"8–12 ครั้ง",sets:4,rest:"1:50",sec:110,v:Y("6DeLZ6cbgWQ?si=n_p0Efym9P8QQR3h")}
    ]}]},
  {id:"leg",short:"Day 4",title:"Leg Day",blocks:[
    {name:"Leg Day",c:"--leg",warm:Y("0cYq7po-ZGE?si=ZXv984fpsb7xfcmd"),ex:[
      {n:"Support half pistol squat",reps:"ข้างละ 6–8 ครั้ง",sets:4,rest:"3:00",sec:180,v:Y("yh7HfCsCC_Y?si=mbys_MqPwxuuWBl1")},
      {n:"Forward lunges",note:"DB 10 kg",reps:"ข้างละ 12 ครั้ง",sets:4,rest:"1:50",sec:110,v:Y("oqNnL46MmMs?si=BET4chHoW7ZSZ1Ul")},
      {n:"Glute bridges",reps:"20 ครั้ง",sets:4,rest:"1:50",sec:110,v:Y("xkfQkuuL1lw?si=JxPq2C2ooSUKm37l")},
      {n:"Standing calf raise",note:"DB 10 kg",reps:"20 ครั้ง",sets:4,rest:"1:50",sec:110,v:Y("Uyg2QR1WAq8?si=X-f1YBvpb3EPDGg7")},
      {n:"Wall sit",reps:"40 วิ",sets:4,rest:"1:50",sec:110,v:Y("PiluINmDWhY?si=LGdXaiDbsb17cNAH")}
    ]}]},
  {id:"push-2",short:"Day 5",title:"Push Day",blocks:[
    {name:"Push Day",c:"--push",warm:W_PUSH,ex:pushEx(3)}]},
  {id:"rest-2",short:"Rest",title:"พัก",rest:true}
];

const KEY="c1w1-progress";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function total(d){return d.rest?0:d.blocks.reduce((a,b)=>a+b.ex.reduce((x,e)=>x+e.sets,0),0)}
function doneCount(d){const s=state[d.id]||{};return Object.values(s).filter(Boolean).length}

function renderWeek(cur){
  document.getElementById("week").innerHTML=DAYS.map(d=>{
    const c=d.rest?"--line":d.blocks[0].c;
    const pct=d.rest?0:Math.round(doneCount(d)/total(d)*100);
    return `<a href="#${d.id}" class="${d.rest?"rest":""}" style="--c:var(${c})" aria-current="${d.id===cur}">
      <small>${d.short}</small><span>${esc(d.title)}</span>${d.rest?"":`<div class="bar"><i style="width:${pct}%"></i></div>`}</a>`}).join("");
}

function render(){
  let id=location.hash.slice(1);
  let day=DAYS.find(d=>d.id===id&&!d.rest)||DAYS[0];
  renderWeek(day.id);
  document.getElementById("dayTitle").textContent=day.title;
  const n=day.blocks.reduce((a,b)=>a+b.ex.length,0);
  document.getElementById("daySub").textContent=`${n} ท่า · ${total(day)} เซ็ท · พักระหว่างท่า 3:00`;
  const s=state[day.id]||{};
  document.getElementById("main").innerHTML=day.blocks.map((b,bi)=>`
    <section class="block" style="--c:var(${b.c})">
      <div class="bhead"><h2>${esc(b.name)}</h2>
        <a class="warm" href="${b.warm}" target="_blank" rel="noopener">▶ Warm-up video</a></div>
      <ol class="list">${b.ex.map((e,ei)=>{
        const sets=[...Array(e.sets)].map((_,si)=>{const k=`${bi}-${ei}-${si}`;
          return `<button type="button" id="s-${day.id}-${k}" data-k="${k}" data-sec="${e.sec}" data-name="${esc(e.n)}" aria-pressed="${!!s[k]}" aria-label="${esc(e.n)} set ${si+1}">Set ${si+1}</button>`}).join("");
        const all=[...Array(e.sets)].every((_,si)=>s[`${bi}-${ei}-${si}`]);
        return `<li>
          <div class="n">${ei+1}</div>
          <div class="name ${all?"done":""}">${esc(e.n)}${all?" ✓":""}</div>
          <a class="vid" href="${e.v}" target="_blank" rel="noopener">▶ วิดีโอ</a>
          <div class="meta"><span><b>${esc(e.reps)}</b></span><span><b>${e.sets}</b> เซ็ท</span><span>พัก <b>${e.rest}</b></span>${e.note?`<span>${esc(e.note)}</span>`:""}</div>
          <div class="sets">${sets}</div>
        </li>`}).join("")}</ol>
    </section>`).join("");
}

document.getElementById("main").addEventListener("click",ev=>{
  const btn=ev.target.closest(".sets button");if(!btn)return;
  const id=(DAYS.find(d=>d.id===location.hash.slice(1)&&!d.rest)||DAYS[0]).id;
  state[id]=state[id]||{};
  const on=!state[id][btn.dataset.k];
  state[id][btn.dataset.k]=on;save();
  if(on)startTimer(+btn.dataset.sec,btn.dataset.name);
  render();
});

// rest timer
let left=0,tick=null;const tEl=document.getElementById("timer");
function fmt(x){const a=Math.abs(x);return (x<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0")}
function draw(){document.getElementById("timerT").textContent=fmt(left);tEl.classList.toggle("up",left<=0)}
function startTimer(sec,name){left=sec;document.getElementById("timerLbl").textContent="Rest · "+name;tEl.hidden=false;draw();clearInterval(tick);tick=setInterval(()=>{left--;draw()},1000)}
document.getElementById("timerAdd").onclick=()=>{left+=30;draw()};
document.getElementById("timerStop").onclick=()=>{clearInterval(tick);tEl.hidden=true};

// reset with inline confirm
const ra=document.getElementById("resetArea");
ra.addEventListener("click",ev=>{
  const t=ev.target.id;
  if(t==="resetBtn")ra.innerHTML=`<span class="reset-confirm">Clear ticks? <button id="resetYes" type="button">Clear</button><button id="resetNo" type="button">Cancel</button></span>`;
  if(t==="resetYes"){const id=(DAYS.find(d=>d.id===location.hash.slice(1)&&!d.rest)||DAYS[0]).id;delete state[id];save();render()}
  if(t==="resetYes"||t==="resetNo")ra.innerHTML=`<button id="resetBtn" type="button">Reset this day</button>`;
});

window.addEventListener("hashchange",render);
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
