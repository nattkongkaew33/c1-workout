<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="C1 Workout">
<meta name="theme-color" content="#11151b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%;background:#11151b}body{margin:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}</style>
<title>C1 Week 1 Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: gym-floor dark UI. Week schedule → workout logger → calendar → progress → plan editor. Fixed bottom nav, rest timer above it, bottom sheet for day changes. Single dark theme by design. */
:root{
  --bg:#11151b; --card:#1a2029; --field:#10141a; --line:#2a323e; --ink:#e8ecf1; --muted:#8b95a5;
  --blue:#4c8dff; --green:#45c28a; --red:#e8664f; --amber:#f0b43c;
  --push:#e05a9c; --abs:#e8894a; --pull:#45b067; --leg:#3d9ae0; --other:#9b8cff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-block:14px 170px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.eyebrow{font:600 13px var(--body);color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;margin:2px 0 0;text-wrap:balance}
h2.sec{font-family:var(--display);font-weight:800;font-size:22px;margin:22px 0 8px}
.muted{color:var(--muted);font-size:14px}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#06142e}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
input.txt,select.txt{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;width:100%;min-width:0}

/* week */
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}
.wkhead .rng{font-weight:600}
.wkhead .rng small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.arrows{display:flex;gap:6px}
.arrows button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 36px;gap:8px;align-items:center;margin-bottom:10px}
.wd{text-align:center;color:var(--muted);font:600 13px var(--body);line-height:1.2}
.wd span{display:block;font:700 20px var(--display);color:var(--ink)}
.wd.on,.wd.on span{color:var(--blue)}
.more{width:36px;height:44px;border:0;background:transparent;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.wcard{display:flex;align-items:center;gap:12px;min-width:0;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-decoration:none}
.wcard.st-complete{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.wcard.st-missed{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.wcard.st-today,.wcard.st-progress{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 8%,var(--card))}
.wcard.rest{background:transparent}
.ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.wtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.wtxt small{font-size:13px;font-weight:600}
.st-complete .wtxt small{color:var(--green)} .st-missed .wtxt small{color:var(--red)} .st-today .wtxt small,.st-progress .wtxt small{color:var(--blue)}
.wtxt strong{font:700 22px var(--display);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtxt em{font-style:normal;font-size:13px;color:var(--muted)}
.wtxt em b{color:var(--blue);font-weight:600}
.moved{color:var(--amber);font-size:12px;font-weight:600}
.startbtn{flex:none;background:var(--blue);color:#06142e;font-weight:700;border-radius:999px;padding:10px 16px;font-size:15px}

/* workout */
.whead{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.wtop{display:flex;align-items:center;gap:12px}
.back{font-size:24px;text-decoration:none;width:36px;height:36px;display:grid;place-items:center;flex:none}
.wt{flex:1;min-width:0}
.wt small{color:var(--muted);font-size:14px}
.wt h1{font-size:30px}
.finish{flex:none;border:2px solid var(--blue);color:var(--blue);background:transparent;border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer}
.startw{flex:none;border:0;background:var(--blue);color:#06142e;border-radius:12px;padding:10px 16px;font-weight:800;font-size:16px;cursor:pointer}
.el.live{font-size:18px}
.donepill{flex:none;color:var(--green);font-weight:700;border:1.5px solid var(--green);border-radius:12px;padding:7px 12px;font-size:14px}
.wbar{display:flex;align-items:center;gap:12px;margin-top:8px;font-variant-numeric:tabular-nums}
.el{color:var(--blue);font-weight:600;min-width:84px;white-space:nowrap}
.pbar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
#pcount{color:var(--muted);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.chipl{font-size:13px;text-decoration:none;border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px}
.swap{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.swap select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.ex{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.ex.alldone{border-color:color-mix(in srgb,var(--green) 50%,var(--line))}
.exh{display:flex;gap:12px;align-items:flex-start}
.thumb{flex:none;width:68px;height:68px;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--c) 22%,var(--field));display:grid;place-items:center;position:relative;text-decoration:none;color:var(--ink);font-size:20px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.exn{flex:1;min-width:0}
.exname{color:var(--blue);font-weight:600;font-size:18px;text-decoration:none;line-height:1.25;display:block}
.tgt{color:var(--muted);font-size:14px;margin-top:2px}
.sugg{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent);border-radius:8px;padding:3px 8px}
.note{width:100%;margin-top:10px;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--ink);font:inherit;font-size:14px;padding:6px 2px}
.note::placeholder{color:var(--muted)}
.tbl{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:separate;border-spacing:0 8px;font-variant-numeric:tabular-nums}
th{font:600 13px var(--body);letter-spacing:.04em;color:var(--muted);text-align:center;padding:0 4px}
th:nth-child(2){text-align:left}
td{text-align:center;padding:0 4px}
.sn{display:inline-grid;place-items:center;width:32px;height:36px;border-radius:8px;background:var(--field);font-weight:700}
.prev{text-align:left;color:var(--muted);font-size:14px;white-space:nowrap}
td input{width:64px;height:42px;border-radius:10px;border:1px solid transparent;background:var(--field);color:var(--ink);text-align:center;font:600 18px var(--body);font-variant-numeric:tabular-nums}
td input::placeholder{color:#59616e}
.chk{width:38px;height:38px;border-radius:50%;border:2px solid #c7cdd6;background:transparent;cursor:pointer;display:grid;place-items:center}
.chk[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.chk[aria-pressed="true"]::after{content:"";width:12px;height:7px;border:3px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
tr.done td input{background:color-mix(in srgb,var(--green) 16%,var(--field))}
tr.done .sn{background:color-mix(in srgb,var(--green) 28%,var(--field))}
.exf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.exf button{height:44px;border-radius:10px;border:0;background:var(--field);font-weight:600;font-size:15px;cursor:pointer}
.pick{display:grid;gap:10px;margin-top:14px}
.pick button{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;cursor:pointer;font-weight:600;font-size:16px}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0}
.cal-head button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:18px;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font:600 11px var(--body);letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cal-day{aspect-ratio:1/1.1;max-width:100%;border:1px solid transparent;border-radius:8px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;cursor:pointer;font:500 14px var(--body);font-variant-numeric:tabular-nums}
.cal-day.has{background:var(--field)}
.cal-day.today{border-color:var(--muted)}
.cal-day[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cal-day.future{opacity:.5}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.dots i{font:700 9px var(--body);font-style:normal;color:#0b0e12;background:var(--c);border-radius:3px;padding:0 3px;line-height:14px}
.dots i.plan{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend b{color:var(--ink)}
.dayrec{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.dayrec h3{font-family:var(--display);font-weight:700;font-size:21px;margin:0 0 6px}
.dayrec p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.sesslink{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--field);text-decoration:none;margin-bottom:10px;font-weight:600}
.sesslink span{color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14px var(--body);min-width:80px;height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.chip::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#0b0e12}
.chip[aria-pressed="true"]::before{background:#0b0e12}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:800 30px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.chartbox svg{display:block;width:100%;height:auto}
.exp{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.exp strong{font-weight:600}
.exp .muted{font-size:13px;grid-column:1}
.exp svg{grid-column:2;grid-row:1/4;width:110px;height:40px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}

/* plan editor */
.wkplan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
.wkplan label{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;font-weight:600;color:var(--muted)}
details.pw{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.pw summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;font:700 20px var(--display)}
details.pw summary::-webkit-details-marker{display:none}
details.pw summary small{font:500 13px var(--body);color:var(--muted);margin-left:auto}
.pwbody{padding:0 14px 14px;display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fl{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.pex{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--field)}
.pex .grid3{display:grid;grid-template-columns:minmax(0,1.3fr) 64px minmax(0,1fr);gap:8px}
.pexbar{display:flex;gap:6px;align-items:center}
.pexbar b{flex:1;font-weight:700;color:var(--muted);font-size:13px}
.pexbar button{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:#06142e}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* fixed */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0c1015;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;padding:4px 8px}
.nav a[aria-current="page"]{color:var(--blue)}
.timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--blue);color:#06142e;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;gap:14px;align-items:center}
.timer .t{font:800 32px var(--display);font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.timer .lbl{font-size:12px;font-weight:600;max-width:150px}
.timer button{font-weight:700;font-size:13px;background:transparent;border:1.5px solid currentColor;border-radius:8px;padding:6px 12px;cursor:pointer}
.timer.up{background:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:12;background:var(--ink);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:999px;font-size:14px;max-width:90vw;text-align:center}
.scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:85vh;overflow:auto}
.sheet .in{max-width:600px;margin:0 auto;display:grid;gap:12px}
.sheet h3{font:800 24px var(--display);margin:0}
.sheet .opt{display:grid;gap:6px}
.sheet .opt>span{font-size:13px;font-weight:600;color:var(--muted)}
.sheet .inline{display:flex;gap:8px}
.sheet .inline .txt{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<div class="timer" id="timer" hidden>
  <div class="lbl" id="timerLbl">Rest</div>
  <div class="t" id="timerT">0:00</div>
  <button type="button" id="timerAdd">+30s</button>
  <button type="button" id="timerStop">Skip</button>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" hidden></div>
<nav class="nav" aria-label="Main">
  <a href="#week" data-tab="week"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Workout</a>
  <a href="#calendar" data-tab="calendar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
  <a href="#progress" data-tab="progress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progress</a>
  <a href="#plan" data-tab="plan"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Plan</a>
</nav>

<script>
/* ---------- default plan (coach's C1 Week 1) ---------- */
const U=id=>"https://youtu.be/"+id;
const pushEx=sets=>[
  {n:"Dip",reps:"3–5 ครั้ง",sets:3,rest:"3:00–5:00",v:U("1e7nKhGvnQQ?si=TtoyzFl_jk5jt6Dm")},
  {n:"Retract scapular pike push up",reps:"8–12 ครั้ง",sets,rest:"2:00",v:U("GK_neUhsVdA?si=2pRlK9Aa3-gqKAii")},
  {n:"Skull crusher",reps:"10–12 ครั้ง",sets,rest:"2:00",v:U("Ujqqm65d0us?si=nr2-hNKrvzdYyZMR")},
  {n:"Push up",reps:"12–15 ครั้ง",sets,rest:"1:50",v:U("-5l_dcFY26Q?si=rW3n6gYZb--SEHY3")},
  {n:"Scapular push-up",reps:"20 ครั้ง",sets,rest:"1:50",v:U("c_d70dOf5No?si=9NII3E7Is8ylH8YH")}
];
const DEFAULT_PLAN={name:"C1 · Week 1",week:["push-1","abs",null,"pull","leg","push-2",null],days:{
  "push-1":{title:"Push 1",type:"push",warm:U("5s6RPJwTNBc?si=ETncuUgcvWN50zuV"),ex:pushEx(4)},
  "abs":{title:"Abs",type:"abs",warm:U("6sH8MsYVhmY?si=W8F01vZ_iJ6rcdUt"),ex:[
    {n:"Hanging L-sit hold",reps:"10–15 วิ",sets:4,rest:"3:00",v:U("4SFqyK0uOyQ?si=MbT3hw_2ZBMpPQBp")},

const TYPES=[["push","Push","--push"],["pull","Pull","--pull"],["leg","Legs","--leg"],["abs","Abs","--abs"],["other","Other","--other"]];

/* ---------- storage ---------- */
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let UNIT=store.get("c1-unit","kg");   // weights are stored in kg; shown in UNIT
const KG2LB=2.20462;
const toDisp=k=>{const v=parseFloat(k);if(k===""||k==null||!isFinite(v))return "";return String(UNIT==="lb"?Math.round(v*KG2LB*2)/2:+v.toFixed(2))};

/* schedule: per-date override first, then weekly plan */
const basePlan=d=>PLAN.week[(parse(d).getDay()+6)%7]||null;
function planFor(d){

const started=s=>!!s&&(!!s.go||s.ex.some(x=>x.sets.some(t=>t.d)));

/* sessions keep a copy of the exercise list, so later plan edits don't change history */
function blank(day){const P=D(day);return {day,title:P.title,type:P.type,start:null,end:null,ex:P.ex.map(e=>({n:e.n,reps:e.reps,rest:e.rest,v:e.v,note:e.note||"",memo:"",sets:Array.from({length:+e.sets||1},()=>({w:"",r:"",d:false}))}))}}
function ensure(date,day){if(!S[date]||(S[date].day!==day&&!started(S[date])))S[date]=blank(day);return S[date]}
let wakeLock=null;

function begin(date,day){const s=ensure(date,day);if(!s.start)s.start=Date.now();s.go=true;saveS();wake(true);return s}

// migrate sessions saved by the previous version
for(const d in S){const s=S[d],P=D(s.day);if(!s.title&&P){s.title=P.title;s.type=P.type}s.ex.forEach((x,i)=>{const e=P&&P.ex[i]||{};if(!x.n){x.n=e.n||"Exercise "+(i+1);x.reps=e.reps;x.rest=e.rest||e.sec;x.v=e.v?(String(e.v).startsWith("http")?e.v:U(e.v)):"";x.memo=x.note||"";x.note=e.note||""}})}

/* history by exercise name (works across Push 1 / Push 2 and after plan edits) */
function lastFor(name,beforeDate){
  let best=null,bd=null;
  for(const d in S){if(d>=beforeDate)continue;const x=S[d].ex.find(e=>e.n===name);if(x&&x.sets.some(t=>t.d)&&(!bd||d>bd)){best=x;bd=d}}
  return best?{x:best,date:bd}:null;
}
function suggestion(e,last){

  if(!top||done.length<(+e.sets||1)||!done.every(t=>(+t.r||0)>=top))return null;
  const w=Math.max(...done.map(t=>parseFloat(t.w)||0));
  if(w>0){const nx=+toDisp(w)+(UNIT==="lb"?5:2.5);return {text:`↑ You hit ${top} on every set — try ${nx} ${UNIT}`,w:nx}}
  return {text:timed(e)?`↑ Every set hit ${top}s — add 5 seconds`:`↑ Every set hit ${top} — add a rep or slow the lowering`};
}
function status(d){

const chosen={}; let weekOff=0, calY=new Date().getFullYear(), calM=new Date().getMonth(), selDate=today(), openPw=null, pendingImport=null, confirmReset=false;

function viewWorkout(date){

function viewProgress(){

  const weeks=[...Array(8)].map((_,i)=>{const m=addDays(mon,-(7-i)*7);return {m,c:ds.filter(d=>d>=m&&d<addDays(m,7)).length}});
  const maxC=Math.max(4,...weeks.map(w=>w.c));
  const W=320,H=140,pl=24,pb=22,bw=(W-pl)/8;
  let bars=`<line x1="${pl}" y1="${H-pb}" x2="${W}" y2="${H-pb}" stroke="var(--line)"/>`;
  for(let g=1;g<=maxC;g++){const y=H-pb-(H-pb-10)*g/maxC;if(g%Math.ceil(maxC/4)===0)bars+=`<line x1="${pl}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${pl-6}" y="${y+4}" fill="var(--muted)" font-size="10" text-anchor="end">${g}</text>`}
  weeks.forEach((w,i)=>{const h=(H-pb-10)*w.c/maxC,x=pl+i*bw+bw*.2,cur=i===7;
    bars+=`<rect x="${x}" y="${H-pb-h}" width="${bw*.6}" height="${Math.max(h,0)}" rx="3" fill="${cur?"var(--blue)":"color-mix(in srgb,var(--blue) 45%,var(--card))"}"/>`;
    if(w.c)bars+=`<text x="${x+bw*.3}" y="${H-pb-h-4}" fill="var(--ink)" font-size="11" text-anchor="middle" font-weight="600">${w.c}</text>`;
    bars+=`<text x="${x+bw*.3}" y="${H-6}" fill="var(--muted)" font-size="10" text-anchor="middle">${parse(w.m).getDate()}/${parse(w.m).getMonth()+1}</text>`});
  // per exercise
  const by={};
  ds.forEach(d=>S[d].ex.forEach(x=>{const dn=x.sets.filter(q=>q.d);if(!dn.length)return;
    const tw=Math.max(...dn.map(q=>parseFloat(q.w)||0)),tr=Math.max(...dn.map(q=>+q.r||0));
    (by[x.n]=by[x.n]||[]).push({d,tw,tr,timed:timed(x),sets:dn})}));
  const exRows=Object.entries(by).sort((a,b)=>b[1][b[1].length-1].d.localeCompare(a[1][a[1].length-1].d)).map(([n,arr])=>{
    const useW=arr.some(a=>a.tw>0),vals=arr.slice(-10).map(a=>useW?+toDisp(a.tw):a.tr),unit=useW?" "+UNIT:(arr[0].timed?"s":" reps");
    const best=arr.reduce((b,a)=>{const s=a.sets.reduce((x,q)=>{const k=(parseFloat(q.w)||0)*1000+(+q.r||0);return k>x.k?{k,q}:x},{k:-1});return s.k>b.k?s:b},{k:-1}).q;
    const last=arr[arr.length-1];
    const mn=Math.min(...vals),mx=Math.max(...vals),sx=vals.length>1?100/(vals.length-1):0,sy=v=>mx===mn?20:34-(v-mn)/(mx-mn)*28;
    const pts=vals.map((v,i)=>`${5+i*sx},${sy(v)}`).join(" ");
    const lp=pts.split(" ").pop().split(",");
    const spark=vals.length>1?`<svg viewBox="0 0 110 40" aria-hidden="true"><polygon points="5,38 ${pts} ${lp[0]},38" fill="color-mix(in srgb,var(--blue) 18%,transparent)"/><polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/><circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="var(--blue)"/></svg>`:`<svg viewBox="0 0 110 40" aria-hidden="true"><circle cx="55" cy="20" r="3.5" fill="var(--blue)"/></svg>`;
    const fmt=q=>q?`${parseFloat(q.w)?toDisp(q.w)+" "+UNIT+" × ":""}${q.r||"-"}${timed(arr[0])||arr[0].timed?"s":""}`:"—";
    return `<div class="exp"><strong>${esc(n)}</strong><span class="muted">Best: ${fmt(best)} · top ${vals[vals.length-1]}${unit}</span><span class="muted">Last: ${fshort(last.d)} · ${last.sets.length} sets · ${arr.length} session${arr.length>1?"s":""}</span>${spark}</div>`}).join("");
  app.innerHTML=`<div class="eyebrow">Your training</div><h1>Progress</h1>
    <div class="stats"><div class="stat"><b>${ds.filter(d=>d>=mon).length}</b><span>this week</span></div><div class="stat"><b>${ds.filter(d=>d.startsWith(mk)).length}</b><span>this month</span></div><div class="stat"><b>${sets}</b><span>sets logged</span></div></div>
    <h2 class="sec">Workouts per week</h2><div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Workouts per week, last 8 weeks">${bars}</svg></div>
    <h2 class="sec">Exercises</h2><p class="muted" style="margin:-4px 0 10px">Line shows your top weight each session (or top reps for bodyweight moves).</p>
    ${exRows||`<div class="empty">Finish your first workout and your lifts will show up here.</div>`}`;
}

/* ---------- day sheet: move / swap / change / rest ---------- */
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
function openSheet(d){
  const s=S[d],locked=started(s),pl=planFor(d);
  const opts=`<option value="rest"${!pl?" selected":""}>Rest day</option>`+Object.entries(PLAN.days).map(([id,P])=>`<option value="${id}"${id===pl?" selected":""}>${esc(P.title)}</option>`).join("");
  sheet.innerHTML=`<div class="in"><h3 id="sheetTitle">${flong(d)}</h3>
    ${locked?`<p class="muted">You already logged sets on this day, so it can’t be moved. Open it to keep editing.</p><a class="btn primary" style="display:grid;place-items:center;text-decoration:none" href="#w-${d}">Open workout</a>`:`
    <div class="opt"><span>Workout on this day</span><select class="txt" id="sh-day" data-shday="${d}">${opts}</select></div>
    ${pl?`<button type="button" class="btn" data-shrest="${d}">Make it a rest day</button>`:""}
    <div class="opt"><span>${pl?"Move this workout to":"Swap this day with"}</span><div class="inline"><input type="date" class="txt" id="sh-to" value="${addDays(d,1)}"><button type="button" class="btn primary" data-shmove="${d}">${pl?"Move":"Swap"}</button></div>
    <span style="font-weight:400">The two days swap: whatever was on that date comes here.</span></div>
    ${d in SCHED?`<button type="button" class="btn" data-shreset="${d}">Back to the weekly plan (${basePlan(d)&&D(basePlan(d))?esc(D(basePlan(d)).title):"Rest"})</button>`:""}`}
    <button type="button" class="btn" data-shclose="1">Close</button></div>`;
  sheet.hidden=false;scrim.hidden=false;
  const f=sheet.querySelector("select,input,a");if(f)f.focus();
}
function closeSheet(){sheet.hidden=true;scrim.hidden=true}
function setDay(d,val){const b=basePlan(d)&&D(basePlan(d))?basePlan(d):"rest";if(val===b)delete SCHED[d];else SCHED[d]=val;if(S[d]&&!started(S[d]))delete S[d];saveSch();saveS()}
scrim.onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet()});
sheet.addEventListener("click",ev=>{
  const b=ev.target.closest("button,a");if(!b)return;
  if(b.dataset.shclose||b.tagName==="A")return closeSheet();
  if(b.dataset.shrest){setDay(b.dataset.shrest,"rest");closeSheet();toast("Changed to a rest day");return render()}
  if(b.dataset.shreset){delete SCHED[b.dataset.shreset];saveSch();closeSheet();toast("Back to the weekly plan");return render()}
  if(b.dataset.shmove){
    const a=b.dataset.shmove,to=document.getElementById("sh-to").value;
    if(!to||to===a){toast("Pick a different date");return}
    if(started(S[to])){toast(`${fshort(to)} already has a logged workout`);return}
    const pa=planFor(a)||"rest",pb=planFor(to)||"rest";
    setDay(to,pa);setDay(a,pb);closeSheet();
    toast(pa==="rest"?`Swapped with ${fshort(to)}`:`${D(pa).title} moved to ${fshort(to)}`);
    if(mondayOf(to)!==mondayOf(addDays(mondayOf(today()),weekOff*7))&&location.hash!=="#calendar")weekOff=Math.round((parse(mondayOf(to))-parse(mondayOf(today())))/6048e5);
    return render();
  }
});
sheet.addEventListener("change",ev=>{if(ev.target.dataset.shday){const d=ev.target.dataset.shday;setDay(d,ev.target.value);closeSheet();toast(ev.target.value==="rest"?"Changed to a rest day":`Changed to ${D(ev.target.value).title}`);render()}});

/* ---------- backup ---------- */
function backupData(){return {app:"c1-workout",version:2,exported:new Date().toISOString(),sessions:S,log:LOG,plan:PLAN,sched:SCHED,first:FIRST,unit:UNIT}}
async function exportBackup(){
  const json=JSON.stringify(backupData(),null,1),name=`c1-workout-backup-${today()}.json`;
  try{
    const file=new File([json],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"C1 Workout backup"});store.set("c1-lastbackup",new Date().toISOString());toast("Backup saved");return render()}
  }catch(e){if(e&&e.name==="AbortError")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();store.set("c1-lastbackup",new Date().toISOString());toast("Backup downloaded");render()}
  catch(e){toast("Couldn’t save a file here. Use Copy backup text instead.")}
}
function applyImport(b){S=b.sessions||{};LOG=b.log||{};PLAN=b.plan||clone(DEFAULT_PLAN);SCHED=b.sched||{};if(b.first){FIRST=b.first;store.set("c1-first",FIRST)}if(b.unit){UNIT=b.unit;store.set("c1-unit",UNIT)}saveS();saveL();saveP();saveSch()}

/* ---------- live bits ---------- */
function tickWorkout(){
  const el=document.getElementById("elapsed");if(!el)return;
  const s=S[app.dataset.date],x=s&&s.day===app.dataset.day?s:null;
  el.textContent="⏱ "+(x&&x.start?fmtDur((x.end||Date.now())-x.start):"Tap Start");el.classList.toggle("live",!!(x&&x.start&&!x.end));
  const list=x?x.ex:(D(app.dataset.day)||{ex:[]}).ex,tot=list.length,dn=x?x.ex.filter(e=>e.sets.length&&e.sets.every(t=>t.d)).length:0;
  document.getElementById("pfill").style.width=(tot?dn/tot*100:0)+"%";
  document.getElementById("pcount").textContent=`${dn}/${tot}`;
}
setInterval(tickWorkout,1000);
let left=0,tick=null;const tEl=document.getElementById("timer");
function draw(){document.getElementById("timerT").textContent=(left<0?"+":"")+fmtDur(Math.abs(left)*1000);tEl.classList.toggle("up",left<=0)}
function startTimer(sec,name){left=sec;document.getElementById("timerLbl").textContent="Rest · "+name;tEl.hidden=false;draw();clearInterval(tick);tick=setInterval(()=>{left--;draw()},1000)}
document.getElementById("timerAdd").onclick=()=>{left+=30;draw()};
document.getElementById("timerStop").onclick=()=>{clearInterval(tick);tEl.hidden=true};
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- events ---------- */
const app=document.getElementById("app");
app.addEventListener("click",async ev=>{
  const q=s=>ev.target.closest(s);let b;
  if(b=q("[data-startnow]"))pendingStart=b.dataset.startnow;
  if(b=q("[data-sheet]")){ev.preventDefault();return openSheet(b.dataset.sheet)}
  if(b=q("[data-unit]")){if(UNIT!==b.dataset.unit){UNIT=b.dataset.unit;store.set("c1-unit",UNIT);toast(`Weights now shown in ${UNIT}`)}return render()}
  if(b=q("[data-wk]")){weekOff+=+b.dataset.wk;return render()}
  if(b=q("[data-pick]")){chosen[location.hash.slice(3)]=b.dataset.pick;return render()}
  if(b=q("[data-nav]")){calM+=+b.dataset.nav;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}return render()}
  if(b=q(".cal-day")){selDate=b.dataset.date;return render()}
  if(b=q(".chip")){const k=b.dataset.type;LOG[selDate]=LOG[selDate]||{};if(LOG[selDate][k])delete LOG[selDate][k];else LOG[selDate][k]={m:true};if(!Object.keys(LOG[selDate]).length)delete LOG[selDate];saveL();return render()}
  // plan editor
  if(b=q("[data-mv]")){const [id,i,dir]=b.dataset.mv.split(":"),ex=D(id).ex,a=+i,c=a+ +dir;if(c<0||c>=ex.length)return;[ex[a],ex[c]]=[ex[c],ex[a]];saveP();openPw=id;return render()}
  if(b=q("[data-del]")){const [id,i]=b.dataset.del.split(":");D(id).ex.splice(+i,1);saveP();openPw=id;return render()}
  if(b=q("[data-addex]")){const id=b.dataset.addex;D(id).ex.push({n:"New exercise",reps:"8–12 ครั้ง",sets:3,rest:"1:30",v:"",note:""});saveP();openPw=id;render();const el=document.getElementById(`pe-${id}-${D(id).ex.length-1}-n`);if(el){el.focus();el.select()}return}
  if(b=q("[data-delday]")){const id=b.dataset.delday;if(Object.keys(PLAN.days).length<2){toast("Keep at least one workout");return}delete PLAN.days[id];PLAN.week=PLAN.week.map(w=>w===id?null:w);for(const d in SCHED)if(SCHED[d]===id)delete SCHED[d];saveP();saveSch();toast("Workout deleted");return render()}
  if(b=q("[data-newday]")){const id="w"+Date.now().toString(36);PLAN.days[id]={title:"New workout",type:"other",warm:"",ex:[{n:"New exercise",reps:"8–12 ครั้ง",sets:3,rest:"1:30",v:"",note:""}]};saveP();openPw=id;return render()}
  if(b=q("[data-act=export]"))return exportBackup();
  if(b=q("[data-act=copy]")){const json=JSON.stringify(backupData());try{await navigator.clipboard.writeText(json);store.set("c1-lastbackup",new Date().toISOString());toast("Backup copied — paste it into Notes or a file");render()}catch(e){toast("Copy isn’t allowed here. Use Export backup.")}return}
  if(b=q("[data-act=doimport]")){applyImport(pendingImport);pendingImport=null;toast("Backup restored");return render()}
  if(b=q("[data-act=noimport]")){pendingImport=null;return render()}
  if(b=q("[data-act=reset]")){confirmReset=true;return render()}
  if(b=q("[data-act=noreset]")){confirmReset=false;return render()}
  if(b=q("[data-act=doreset]")){PLAN=clone(DEFAULT_PLAN);saveP();confirmReset=false;toast("Plan reset to Week 1");return render()}
  // workout
  const date=app.dataset.date,day=app.dataset.day;
  if(b=q("[data-chk]")){
    const [i,j]=b.dataset.chk.split("-").map(Number),s=ensure(date,day),e=s.ex[i],t=e.sets[j];
    t.d=!t.d;
    if(t.d&&!s.start){s.start=Date.now();s.go=true;wake(true)}
    if(t.d){const row=b.closest("tr");if(!t.w)t.w=fromDisp(row.querySelector('[data-f="w"]').placeholder.replace(/^-$/,""));if(!t.r)t.r=row.querySelector('[data-f="r"]').placeholder;startTimer(restSec(e.rest),e.n)}
    saveS();return render();
  }
  if(b=q("[data-add]")){const s=ensure(date,day);s.ex[+b.dataset.add].sets.push({w:"",r:"",d:false});saveS();return render()}
  if(b=q("[data-rest]")){const s=S[date]&&S[date].day===day?S[date]:blank(day),e=s.ex[+b.dataset.rest];return startTimer(restSec(e.rest),e.n)}
  if(b=q("[data-act=start]")){begin(date,day);toast("Workout started — timer running");return render()}
  if(b=q("[data-act=finish]")){
    const s=S[date];
    if(!s||!s.start){toast("Tap Start first");return}
    s.go=true;s.end=Date.now();saveS();clearInterval(tick);tEl.hidden=true;wake(false);toast(`${titleOf(s)} saved · ${fmtDur(s.end-s.start)}`);location.hash="#week";
  }
});
app.addEventListener("toggle",ev=>{const d=ev.target.closest&&ev.target.closest("details.pw");if(d&&d.open)openPw=d.dataset.pw},true);
app.addEventListener("input",ev=>{
  const el=ev.target,date=app.dataset.date,day=app.dataset.day;
  if(el.dataset.f){const [i,j]=el.dataset.k.split("-").map(Number);ensure(date,day).ex[i].sets[j][el.dataset.f]=el.dataset.f==="w"?fromDisp(el.value):el.value;saveS()}
  else if(el.dataset.memo){ensure(date,day).ex[+el.dataset.memo].memo=el.value;saveS()}
  else if(el.dataset.pe){const [id,i]=el.dataset.pe.split(":");let v=el.value;if(el.dataset.k==="sets")v=Math.max(1,Math.min(10,parseInt(v)||1));D(id).ex[+i][el.dataset.k]=v;saveP();if(el.dataset.k==="n"||el.dataset.k==="sets"){const sm=el.closest("details").querySelector("summary small");if(sm)sm.textContent=D(id).ex.length+" exercises"}}
  else if(el.dataset.pd&&el.tagName==="INPUT"){D(el.dataset.pd)[el.dataset.k]=el.value;saveP()}
  else if(el.dataset.pname){PLAN.name=el.value;saveP()}
});
app.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id&&el.id.startsWith("swap-")){const date=app.dataset.date;chosen[date]=el.value;if(S[date]&&!started(S[date]))delete S[date];saveS();return render()}
  if(el.dataset.weekday){PLAN.week[+el.dataset.weekday]=el.value||null;saveP();toast(`${WDN[+el.dataset.weekday]} → ${el.value?D(el.value).title:"Rest"}`);return}
  if(el.dataset.pd&&el.tagName==="SELECT"){D(el.dataset.pd)[el.dataset.k]=el.value;saveP();openPw=el.dataset.pd;return render()}
  if(el.dataset.pd&&el.dataset.k==="title"){openPw=el.dataset.pd;return render()}
  if(el.id==="importFile"&&el.files[0]){
    const r=new FileReader();r.onload=()=>{try{const b=JSON.parse(r.result);if(b.app!=="c1-workout")throw 0;pendingImport=b;render()}catch(e){toast("That file isn’t a C1 Workout backup")}};r.readAsText(el.files[0]);
  }
});

function render(){
  const h=location.hash.slice(1),tab=h.startsWith("w-")?"week":(["calendar","progress","plan"].includes(h)?h:"week");
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===tab?"page":"false"));
  delete app.dataset.date;
  if(/^w-\d{4}-\d{2}-\d{2}$/.test(h))viewWorkout(h.slice(2));
  else if(h==="calendar")viewCal();
  else if(h==="progress")viewProgress();
  else if(h==="plan")viewPlan();
  else viewWeek();
}
window.addEventListener("hashchange",()=>{closeSheet();render();window.scrollTo(0,0)});
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
