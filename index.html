<title>C1 Week 1 Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: gym-floor dark UI. Week schedule → workout logger → calendar → progress → plan editor. Fixed bottom nav, rest timer above it, bottom sheet for day changes. Single dark theme by design. */
:root{
  /* "Chalk & plates": indigo gym floor, chalk-white type, bumper-plate colours. --blue is the accent (bumper yellow). */
  --bg:#0e1222; --card:#171c30; --card2:#1d2340; --field:#0b0f1c; --line:#262c46; --ink:#f2f0ea; --muted:#8e95b2;
  --blue:#ffd23f; --on-acc:#1a1405; --green:#2ed48a; --red:#ff5a5f; --amber:#ffb84d;
  --push:#ff5a5f; --abs:#ff9a3c; --pull:#2ed48a; --leg:#4c7dff; --other:#b49cff;
  --glow:#1b2146;
  --display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  /* same chalk & plates palette, lit for daylight: chalk floor, ink type */
  --bg:#f5f3ee; --card:#ffffff; --card2:#eef0f6; --field:#eef0f6; --line:#dadfea; --ink:#171a2b; --muted:#5b6178;
  --blue:#dd9900; --on-acc:#1a1405; --green:#1f9d68; --red:#d93c3c; --amber:#b9790a;
  --push:#d93c3c; --abs:#c9701a; --pull:#1f9d68; --leg:#2f5fd9; --other:#7b5fe0;
  --glow:#e9e4ff;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-block:14px 170px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.eyebrow{font:600 13px var(--body);color:var(--muted)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.refresh{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line,#2a2f36);background:transparent;color:var(--muted);font:600 13px var(--body);cursor:pointer}
.refresh svg{width:16px;height:16px}
.refresh.spin svg{animation:rspin .8s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;margin:2px 0 0;text-wrap:balance}
h2.sec{font-family:var(--display);font-weight:800;font-size:22px;margin:22px 0 8px}
.muted{color:var(--muted);font-size:14px}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-acc)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
input.txt,select.txt{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;width:100%;min-width:0}

/* week */
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}
.wkhead .rng{font-weight:600}
.wkhead .rng small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.arrows{display:flex;gap:6px}
.arrows button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 36px;gap:8px;align-items:center;margin-bottom:10px}
.row .wcard{-webkit-touch-callout:none;-webkit-user-drag:none;-webkit-user-select:none;user-select:none;transition:transform .15s,box-shadow .15s,border-color .15s}
.row.lift .wcard{pointer-events:none;position:relative;z-index:3;transition:none;box-shadow:0 18px 40px -12px rgba(0,0,0,.8);border-color:var(--blue)}
.row.dropto .wcard{border-color:var(--blue);border-style:dashed;background:color-mix(in srgb,var(--blue) 10%,var(--card))}
a,[data-go]{-webkit-touch-callout:none}
.wcard[data-go]{cursor:pointer}
body.dragging{overflow:hidden;-webkit-user-select:none;user-select:none}
.wd{text-align:center;color:var(--muted);font:600 13px var(--body);line-height:1.2}
.wd span{display:block;font:700 20px var(--display);color:var(--ink)}
.wd.on,.wd.on span{color:var(--blue)}
.more{width:36px;height:44px;border:0;background:transparent;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.wcard{display:flex;align-items:center;gap:12px;min-width:0;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-decoration:none}
.wcard.st-complete{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.wcard.st-missed{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.wcard.st-today,.wcard.st-progress{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 8%,var(--card))}
.wcard.rest{background:transparent}
.ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.wtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.wtxt small{font-size:13px;font-weight:600}
.st-complete .wtxt small{color:var(--green)} .st-missed .wtxt small{color:var(--red)} .st-today .wtxt small,.st-progress .wtxt small{color:var(--blue)}
.wtxt strong{font:700 22px var(--display);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtxt em{font-style:normal;font-size:13px;color:var(--muted)}
.wtxt em b{color:var(--blue);font-weight:600}
.moved{color:var(--amber);font-size:12px;font-weight:600}
.startbtn{flex:none;background:var(--blue);color:var(--on-acc);font-weight:700;border-radius:999px;padding:10px 16px;font-size:15px}

/* workout */
.whead{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.wtop{display:flex;align-items:center;gap:12px}
.back{font-size:24px;text-decoration:none;width:36px;height:36px;display:grid;place-items:center;flex:none}
.wt{flex:1;min-width:0}
.wt small{color:var(--muted);font-size:14px}
.wt h1{font-size:30px}
.finish{flex:none;border:2px solid var(--blue);color:var(--blue);background:transparent;border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer}
.startw{flex:none;border:0;background:var(--blue);color:var(--on-acc);border-radius:12px;padding:10px 16px;font-weight:800;font-size:16px;cursor:pointer}
.el.live{font-size:18px}
.prb{color:var(--amber);font-weight:700;font-size:12px;white-space:nowrap}
.bwrow{display:flex;gap:8px;align-items:center}
.bwrow input{max-width:120px}
.bwlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bwlist span{display:inline-flex;gap:6px;align-items:center;font-size:13px;background:var(--field);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums}
.bwlist button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:0 2px}
.recs{display:grid;gap:6px}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rec b{font-variant-numeric:tabular-nums;white-space:nowrap}
.rec small{display:block;color:var(--muted);font-size:12px}
.wkchips{display:flex;flex-wrap:wrap;gap:6px}
.wkchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.wkchip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-acc)}
.wkchip.add{border-style:dashed;color:var(--muted)}
button.chipl{font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.chipl.on{border-color:var(--green);color:var(--green)}
button.sn{border:0;color:inherit;cursor:pointer;font:inherit;font-weight:700}
.rpe-tag{color:var(--blue);font-size:12px;font-weight:700}
.rpebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--field);border-radius:10px;padding:8px}
.rpebar span{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.rpebar button{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.rpebar button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-acc)}
.rpebar small{flex-basis:100%;color:var(--muted);font-size:11px}
.feel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.feel button{flex:1;min-width:58px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-weight:600;font-size:13px;cursor:pointer}
.feel button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#0b0e12}
textarea.note{resize:vertical;min-height:52px;font:inherit}
.swapbtn{flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.swaprow{display:flex;gap:6px;margin-top:8px}
.streak{margin:8px 0 0;font-size:14px;color:var(--muted)}
.streak b{color:var(--amber)}
.fhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0 10px}
.fhead button{width:40px;height:40px;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--ink)}
.fhead b{min-width:160px;text-align:center;font-size:17px;font-weight:600}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.ntog{display:inline-flex;background:var(--field);border-radius:999px;padding:3px;margin-bottom:10px}
.ntog button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
.ntog button[aria-pressed="true"]{background:color-mix(in srgb,var(--blue) 22%,var(--card));color:var(--blue)}
.nbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nbig b{font:800 52px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.nbig span{color:var(--muted);font-size:17px}
.nbar{height:16px;border-radius:8px;background:var(--line);overflow:hidden;margin:12px 0 16px}
.nbar i{display:block;height:100%;background:var(--blue);border-radius:8px}
.nbar i.over{background:var(--red)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mac small{display:block;font-size:15px;margin-bottom:6px}
.mac .mb{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.mac .mb i{display:block;height:100%;background:var(--c)}
.mac p{margin:6px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mac p b{color:var(--ink)}
.mac p .ok{color:var(--green)}
.flh{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.flh h2{font:800 26px var(--display);margin:0}
.iconbtn{width:40px;height:40px;border:0;background:transparent;color:var(--ink);cursor:pointer;display:inline-grid;place-items:center}
.meal{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.mealh{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 14px}
.mealh button.t{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;font:700 21px var(--display);text-align:left;cursor:pointer;color:var(--ink);padding:0}
.chipc,.chipp{font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chipc{background:color-mix(in srgb,var(--blue) 16%,var(--card));color:var(--blue)}
.chipp{background:color-mix(in srgb,var(--other) 28%,var(--card));color:#e4ddff}
.addm{width:36px;height:36px;border:0;background:transparent;color:var(--blue);font-size:28px;cursor:pointer;line-height:1}
.fitems{display:grid;gap:8px;padding:0 12px 12px}
.fitem{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--field);border:0;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;width:100%}
.fitem span{min-width:0}
.fitem small{display:block;color:var(--muted);font-size:13px}
.fitem .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.foodbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:5;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.foodbar div{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 16px}
.foodbar button.s{flex:1;border:0;background:transparent;text-align:left;font:inherit;font-size:16px;color:var(--muted);padding:10px 0;cursor:pointer}
.bcbtn{display:grid;place-items:center;padding:0 10px;color:var(--blue)}
.foodbar button.cam{width:44px;height:44px;border:0;background:transparent;color:var(--blue);cursor:pointer;display:grid;place-items:center}
.fres{display:grid;gap:6px;max-height:42vh;overflow:auto}
.fres button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit}
.fres small{color:var(--muted);font-size:12px;display:block}
.fres .r{white-space:nowrap;color:var(--muted);font-size:13px;text-align:right}
.fmac{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.fmac div{background:var(--field);border-radius:10px;padding:8px 4px}
.fmac b{display:block;font:800 20px var(--display);font-variant-numeric:tabular-nums}
.fmac span{font-size:11px;color:var(--muted)}
.airow{display:grid;grid-template-columns:auto minmax(0,1fr) 58px minmax(64px,auto);gap:8px;align-items:center;background:var(--field);border-radius:10px;padding:8px 10px}
.airow .gu{color:var(--muted);font-size:14px}
.airow select.gu{padding:6px 4px;max-width:110px}
#fs-u{max-width:55%}
.ainame{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--ink);font:inherit;font-weight:600;padding:2px 0}
.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchips button{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.mealtot{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;margin:0 12px 12px;padding:10px 14px;border-radius:12px;border:1px dashed var(--line);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mealtot b{color:var(--ink)}
.dayk{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px}.dayk.tr{color:var(--blue)}.dayk span{color:var(--muted);font-weight:500}
.copyy{display:block;width:calc(100% - 24px);margin:0 12px 12px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--blue);font:600 14px var(--body);text-align:left;cursor:pointer}
.copyy small{color:var(--muted);font-weight:500}
.copyday{margin:0 0 12px;width:100%}
.airow small{display:block;color:var(--muted);font-size:12px}
.airow input.txt{padding:6px 8px}
.prow{display:flex;gap:6px}
.prow button:first-child{flex:1;min-width:0}
.fres .px{flex:none;width:42px;justify-content:center;align-items:center;color:var(--muted)}
.fsec{margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.saveml{width:36px;height:36px;border:0;background:transparent;color:var(--amber);font-size:20px;cursor:pointer}
.donepill{flex:none;color:var(--green);font-weight:700;border:1.5px solid var(--green);border-radius:12px;padding:7px 12px;font-size:14px}
.wbar{display:flex;align-items:center;gap:12px;margin-top:8px;font-variant-numeric:tabular-nums}
.el{color:var(--blue);font-weight:600;min-width:84px;white-space:nowrap}
.pbar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
#pcount{color:var(--muted);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.chipl{font-size:13px;text-decoration:none;border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px}
.swap{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.swap select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.ex{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.ex.alldone{border-color:color-mix(in srgb,var(--green) 50%,var(--line))}
.exh{display:flex;gap:12px;align-items:flex-start}
.thumb{flex:none;width:68px;height:68px;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--c) 22%,var(--field));display:grid;place-items:center;position:relative;text-decoration:none;color:var(--ink);font-size:20px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.exn{flex:1;min-width:0}
.exname{color:var(--blue);font-weight:600;font-size:18px;text-decoration:none;line-height:1.25;display:block}
.tgt{color:var(--muted);font-size:14px;margin-top:2px}
.sugg{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent);border-radius:8px;padding:3px 8px}
.note{width:100%;margin-top:10px;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--ink);font:inherit;font-size:14px;padding:6px 2px}
.note::placeholder{color:var(--muted)}
.tbl{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:separate;border-spacing:0 8px;font-variant-numeric:tabular-nums}
th{font:600 13px var(--body);letter-spacing:.04em;color:var(--muted);text-align:center;padding:0 4px}
th:nth-child(2){text-align:left}
td{text-align:center;padding:0 4px}
.sn{display:inline-grid;place-items:center;width:32px;height:36px;border-radius:8px;background:var(--field);font-weight:700}
.prev{text-align:left;color:var(--muted);font-size:14px;white-space:nowrap}
td input{width:64px;height:42px;border-radius:10px;border:1px solid transparent;background:var(--field);color:var(--ink);text-align:center;font:600 18px var(--body);font-variant-numeric:tabular-nums}
td input::placeholder{color:var(--muted)}
.chk{width:38px;height:38px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center}
.chk[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.chk[aria-pressed="true"]::after{content:"";width:12px;height:7px;border:3px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
tr.done td input{background:color-mix(in srgb,var(--green) 16%,var(--field))}
tr.done .sn{background:color-mix(in srgb,var(--green) 28%,var(--field))}
.exf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.exf button{height:44px;border-radius:10px;border:0;background:var(--field);font-weight:600;font-size:15px;cursor:pointer}
.pick{display:grid;gap:10px;margin-top:14px}
.pick button{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;cursor:pointer;font-weight:600;font-size:16px}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0}
.cal-head button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:18px;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font:600 11px var(--body);letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cal-day{aspect-ratio:1/1.1;max-width:100%;border:1px solid transparent;border-radius:8px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;cursor:pointer;font:500 14px var(--body);font-variant-numeric:tabular-nums}
.cal-day.has{background:var(--field)}
.cal-day.today{border-color:var(--muted)}
.cal-day[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cal-day.future{opacity:.5}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.dots i{font:700 9px var(--body);font-style:normal;color:#0b0e12;background:var(--c);border-radius:3px;padding:0 3px;line-height:14px}
.dots i.plan{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend b{color:var(--ink)}
.dayrec{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.dayrec h3{font-family:var(--display);font-weight:700;font-size:21px;margin:0 0 6px}
.dayrec p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.sesslink{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--field);text-decoration:none;margin-bottom:10px;font-weight:600}
.sesslink span{color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14px var(--body);min-width:80px;height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.chip::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#0b0e12}
.chip[aria-pressed="true"]::before{background:#0b0e12}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:800 30px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.chartbox svg{display:block;width:100%;height:auto}
.exp{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.exp strong{font-weight:600}
.exp .muted{font-size:13px;grid-column:1}
.exp svg{grid-column:2;grid-row:1/4;width:110px;height:40px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}

/* plan editor */
.wkplan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
.wkplan label{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;font-weight:600;color:var(--muted)}
details.pw{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.pw summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;font:700 20px var(--display)}
details.pw summary::-webkit-details-marker{display:none}
details.pw summary small{font:500 13px var(--body);color:var(--muted);margin-left:auto}
.pwbody{padding:0 14px 14px;display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fl{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.pex{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--field)}
.pex .grid3{display:grid;grid-template-columns:minmax(0,1.3fr) 64px minmax(0,1fr);gap:8px}
.pexbar{display:flex;gap:6px;align-items:center}
.pexbar b{flex:1;font-weight:700;color:var(--muted);font-size:13px}
.pexbar button{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-acc)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* fixed */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;padding:4px 8px}
.nav a[aria-current="page"]{color:var(--blue)}
.timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--blue);color:var(--on-acc);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;gap:14px;align-items:center}
.timer .t{font:800 32px var(--display);font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.timer .lbl{font-size:12px;font-weight:600;max-width:150px}
.timer button{font-weight:700;font-size:13px;background:transparent;border:1.5px solid currentColor;border-radius:8px;padding:6px 12px;cursor:pointer}
.timer.up{background:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:12;background:var(--ink);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:999px;font-size:14px;max-width:90vw;text-align:center}
.scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:85vh;overflow:auto}
.sheet .in{max-width:600px;margin:0 auto;display:grid;gap:12px}
.sheet h3{font:800 24px var(--display);margin:0}
.sheet .opt{display:grid;gap:6px}
.sheet .opt>span{font-size:13px;font-weight:600;color:var(--muted)}
.sheet .inline{display:flex;gap:8px}
.sheet .inline .txt{flex:1}
.scan{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;left:8%;right:8%;top:32%;height:22%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scan .frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff4d4d;animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
.scan .msg{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 24px);color:#fff;text-align:center;font:600 16px var(--body)}
.scan .bar{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;gap:10px}
.scan .bar button{flex:1;min-height:48px;border-radius:14px;border:0;font:600 15px var(--body);background:rgba(255,255,255,.18);color:#fff}
.scan .bar button.pri{background:#fff;color:#000}
/* ---------- v2 look: chalk & plates ---------- */
body{font-size:15px;background:radial-gradient(120% 60% at 50% -10%,var(--glow) 0%,var(--bg) 60%) fixed,var(--bg)}
h1{font-weight:900;font-size:40px;letter-spacing:.005em;text-transform:uppercase;line-height:.95}
h2.sec,.flh h2,.cal-head h2{font-weight:800;letter-spacing:.01em}
.eyebrow{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{border-radius:999px;height:46px;background:var(--card2)}
.btn.sm{height:38px}
.btn.primary{font-weight:700}
input.txt,select.txt{border-radius:12px;padding:10px 12px;border-color:var(--line)}

.wcard{padding:14px 16px;border-width:1px;position:relative;overflow:hidden}

.ico{border-radius:14px}
.startbtn{box-shadow:0 6px 18px -6px color-mix(in srgb,var(--blue) 70%,transparent)}

.wd span{font-size:24px;font-weight:800}
.nav a{font-size:11px;letter-spacing:.02em;border-radius:14px;padding:6px 10px}

.toast{background:var(--blue);color:var(--on-acc);box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.sheet{background:var(--card);border-radius:26px 26px 0 0}

/* plate ring: the signature. A bumper plate seen face-on; the coloured arc is progress. */
.plate{position:relative;width:var(--sz);height:var(--sz);flex:none}

.pl-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}

const saveBW=()=>store.set("c1-bw",BW);

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};

const fmtDur=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`};

const flong=d=>parse(d).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
const timed=e=>/วิ|sec|s$/i.test(e.reps||"");

const restSec=t=>{const m=String(t||"").match(/(\d+):(\d{2})/);return m?+m[1]*60+ +m[2]:(parseInt(t)||90)};

const D=id=>PLAN.days[id];
if(!PROG.start){PROG.start=mondayOf(FIRST);store.set("c1-prog",PROG)}
const weekIdx=d=>Math.max(0,Math.min(PROG.weeks.length-1,Math.round((parse(mondayOf(d))-parse(PROG.start))/6048e5)));

const FEEL=["Rough","Tired","OK","Good","Great"];
const icon=`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>`;
const restIcon=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`;
const dotsIcon=`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>`;

/* schedule: per-date override first, then weekly plan */
const basePlan=d=>WP(d).week[(parse(d).getDay()+6)%7]||null;
function planFor(d){
  if(d in SCHED)return SCHED[d]==="rest"||!DD(d,SCHED[d])?null:SCHED[d];
  const b=basePlan(d);return b&&DD(d,b)?b:null;
}
const started=s=>!!s&&(!!s.go||s.ex.some(x=>x.sets.some(t=>t.d)));
const typeOf=s=>s.type||(D(s.day)||{}).type||"other";
const titleOf=s=>s.title||(D(s.day)||{}).title||"Workout";

/* sessions keep a copy of the exercise list, so later plan edits don't change history */
function blank(day,date){const P=(date&&DD(date,day))||D(day);return {day,title:P.title,type:P.type,start:null,end:null,ex:P.ex.map(e=>({n:e.n,reps:e.reps,rest:e.rest,v:e.v,note:e.note||"",memo:"",sets:Array.from({length:+e.sets||1},()=>({w:"",r:"",d:false}))}))}}
function ensure(date,day){if(!S[date]||(S[date].day!==day&&!started(S[date])))S[date]=blank(day,date);return S[date]}
let wakeLock=null;
async function wake(on){try{if(on&&navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
function begin(date,day){const s=ensure(date,day);if(!s.start)s.start=Date.now();s.go=true;saveS();wake(true);return s}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){const d=app.dataset.date,x=d&&S[d];if(x&&x.go&&!x.end)wake(true)}});
let pendingStart=null;
// migrate sessions saved by the previous version
for(const d in S){const s=S[d],P=D(s.day);if(!s.title&&P){s.title=P.title;s.type=P.type}s.ex.forEach((x,i)=>{const e=P&&P.ex[i]||{};if(!x.n){x.n=e.n||"Exercise "+(i+1);x.reps=e.reps;x.rest=e.rest||e.sec;x.v=e.v?(String(e.v).startsWith("http")?e.v:U(e.v)):"";x.memo=x.note||"";x.note=e.note||""}})}
saveS();

/* history by exercise name (works across Push 1 / Push 2 and after plan edits) */
function lastFor(name,beforeDate){
  let best=null,bd=null;
  for(const d in S){if(d>=beforeDate)continue;const x=S[d].ex.find(e=>e.n===name);if(x&&x.sets.some(t=>t.d)&&(!bd||d>bd)){best=x;bd=d}}
  return best?{x:best,date:bd}:null;
}
function suggestion(e,last){
  if(!last)return null;
  const done=last.x.sets.filter(t=>t.d),top=topTarget(e);
  if(!top||done.length<(Array.isArray(e.sets)?e.sets.length:(+e.sets||1))||!done.every(t=>(+t.r||0)>=top))return null;
  const w=Math.max(...done.map(t=>parseFloat(t.w)||0)),rated=done.filter(t=>t.e),avg=rated.length?rated.reduce((a,t)=>a+t.e,0)/rated.length:0;
  if(avg>=9.5)return {text:`You hit ${top} on every set, but effort was near max — stay at this ${w>0?"weight":"level"} once more`};
  if(w>0){const nx=+toDisp(w)+(UNIT==="lb"?5:2.5);return {text:`↑ You hit ${top} on every set — try ${nx} ${UNIT}`,w:nx}}
  return {text:timed(e)?`↑ Every set hit ${top}s — add 5 seconds`:`↑ Every set hit ${top} — add a rep or slow the lowering`};
}
function histBest(name,beforeDate){let n=0,mw=0,rw=0,mr=0;for(const d in S){if(d>=beforeDate)continue;const x=S[d].ex.find(e=>e.n===name);if(!x)continue;for(const t of x.sets){if(!t.d)continue;n++;const w=parseFloat(t.w)||0,r=+t.r||0;if(w>mw){mw=w;rw=r}else if(w===mw&&r>rw)rw=r;if(r>mr)mr=r}}return {n,mw,rw,mr}}
function prType(h,t){if(!h.n||!t.d)return null;const w=parseFloat(t.w)||0,r=+t.r||0;if(w>0){if(w>h.mw)return "Weight PR";if(w===h.mw&&r>h.rw)return "Rep PR"}else if(h.mw===0&&r>h.mr)return "Rep PR";return null}
function status(d){
  const s=S[d],t=today();
  if(s&&s.end)return "complete";
  if(started(s))return "progress";
  if(!planFor(d))return "rest";
  if(d===t)return "today";
  if(d<t)return d<FIRST?"before":"missed";
  return "upcoming";

const chosen={}; let weekOff=0, calY=new Date().getFullYear(), calM=new Date().getMonth(), selDate=today(), openPw=null, pendingImport=null, confirmReset=false, rpeOpen=null, swapOpen=null, confirmDelW=false;

/* ---------- views ---------- */
const refreshBtn=`<button type="button" class="refresh" data-act="refresh" aria-label="Refresh the app to get the latest version"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>Refresh</button>`;
async function refreshApp(btn){
  if(btn){btn.classList.add("spin");btn.disabled=true}
  try{
    if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.update().catch(()=>{})))}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
  }catch(e){}
  const u=new URL(location.href);u.searchParams.set("r",Date.now());location.replace(u.toString());
}
function plate(pct,o={}){const sz=o.size||140,sw=o.stroke||14,c=sz/2,r=c-sw/2-9,C=2*Math.PI*r,p=Math.max(0,Math.min(1,pct||0));
  const ticks=[...Array(32)].map((_,i)=>{const a=i/32*2*Math.PI,r1=c-3,r2=c-(i%8?5:8);return `<line class="pl-tick" x1="${(c+r1*Math.sin(a)).toFixed(1)}" y1="${(c-r1*Math.cos(a)).toFixed(1)}" x2="${(c+r2*Math.sin(a)).toFixed(1)}" y2="${(c-r2*Math.cos(a)).toFixed(1)}"/>`}).join("");
  return `<div class="plate" style="--sz:${sz}px;--big:${o.big||Math.round(sz*.28)}px"><svg viewBox="0 0 ${sz} ${sz}" aria-hidden="true"><circle class="pl-body" cx="${c}" cy="${c}" r="${c-1}"/>${ticks}<circle class="pl-track" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}"/><circle class="pl-fill" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}" stroke="${o.color||"var(--blue)"}" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"${p===0?' stroke-opacity="0"':""}/><circle class="pl-hub" cx="${c}" cy="${c}" r="${(r-sw/2-6).toFixed(1)}"/></svg><div class="pl-in">${o.inner||""}</div></div>`}
const nSets=e=>Array.isArray(e.sets)?e.sets.length:(+e.sets||0);
function todayHero(){
  const td=today(),ts=S[td],live=ts&&started(ts),day=live?ts.day:planFor(td),dl=parse(td).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});

  const fuel=`<a class="fuel" href="#food"><span>Food today</span><div class="fb"><i style="width:${fp}%"></i></div><b><em>${R(eat)}</em> / ${T.cal} cal</b></a>`;
  if(!day&&!live)return `<a class="hero rest" href="#w-${td}"><div class="ht"><small>Today · ${dl}</small><strong>Rest day</strong><span class="sub">Recover, sleep well and hit your protein.</span></div>${plate(0,{size:104,stroke:10,inner:`<b style="font-size:26px">ZZZ</b>`})}</a>${fuel}`;
  const P=DD(td,day)||{},type=live?typeOf(ts):P.type,title=live?titleOf(ts):P.title,ex=live?ts.ex:(P.ex||[]);
  const total=ex.reduce((a,e)=>a+nSets(e),0),done=live?ts.ex.reduce((a,e)=>a+e.sets.filter(t=>t.d).length,0):0,fin=live&&ts.end;

  return `<a class="hero" href="#w-${td}" style="--c:var(${TCOLOR[type]||"--other"})"><div class="ht"><small>Today · ${dl}</small><strong>${esc(title||"Workout")}</strong><span class="sub">${ex.length} exercises · ${total} sets</span>${btn}</div>${plate(total?done/total:0,{size:112,stroke:11,color:"var(--c)",inner:`<b>${done}</b><small>of ${total} sets</small>`})}</a>${fuel}`}
function viewWeek(){
  const mon=addDays(mondayOf(today()),weekOff*7), dates=[...Array(7)].map((_,i)=>addDays(mon,i));
  const done=dates.filter(d=>S[d]&&S[d].end).length, planned=dates.filter(d=>planFor(d)||started(S[d])).length;
  const rows=dates.map((d,i)=>{
    const st=status(d),s=S[d],isT=d===today(),day=s&&started(s)?null:planFor(d);

function viewProgress(){
  const ds=Object.keys(S).filter(d=>started(S[d])).sort();
  const t=today(),mon=mondayOf(t),mk=t.slice(0,7);
  const sets=ds.reduce((a,d)=>a+S[d].ex.reduce((b,x)=>b+x.sets.filter(q=>q.d).length,0),0);
  const weeks=[...Array(8)].map((_,i)=>{const m=addDays(mon,-(7-i)*7);return {m,c:ds.filter(d=>d>=m&&d<addDays(m,7)).length}});
  const maxC=Math.max(4,...weeks.map(w=>w.c));
  const W=320,H=140,pl=24,pb=22,bw=(W-pl)/8;
  let bars=`<line x1="${pl}" y1="${H-pb}" x2="${W}" y2="${H-pb}" stroke="var(--line)"/>`;
  for(let g=1;g<=maxC;g++){const y=H-pb-(H-pb-10)*g/maxC;if(g%Math.ceil(maxC/4)===0)bars+=`<line x1="${pl}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${pl-6}" y="${y+4}" fill="var(--muted)" font-size="10" text-anchor="end">${g}</text>`}
  weeks.forEach((w,i)=>{const h=(H-pb-10)*w.c/maxC,x=pl+i*bw+bw*.2,cur=i===7;
    bars+=`<rect x="${x}" y="${H-pb-h}" width="${bw*.6}" height="${Math.max(h,0)}" rx="3" fill="${cur?"var(--blue)":"color-mix(in srgb,var(--blue) 45%,var(--card))"}"/>`;
    if(w.c)bars+=`<text x="${x+bw*.3}" y="${H-pb-h-4}" fill="var(--ink)" font-size="11" text-anchor="middle" font-weight="600">${w.c}</text>`;
    bars+=`<text x="${x+bw*.3}" y="${H-6}" fill="var(--muted)" font-size="10" text-anchor="middle">${parse(w.m).getDate()}/${parse(w.m).getMonth()+1}</text>`});
  // per exercise
  const by={};
  ds.forEach(d=>S[d].ex.forEach(x=>{const dn=x.sets.filter(q=>q.d);if(!dn.length)return;
    const tw=Math.max(...dn.map(q=>parseFloat(q.w)||0)),tr=Math.max(...dn.map(q=>+q.r||0));
    (by[x.n]=by[x.n]||[]).push({d,tw,tr,timed:timed(x),sets:dn})}));
  const exRows=Object.entries(by).sort((a,b)=>b[1][b[1].length-1].d.localeCompare(a[1][a[1].length-1].d)).map(([n,arr])=>{
    const useW=arr.some(a=>a.tw>0),vals=arr.slice(-10).map(a=>useW?+toDisp(a.tw):a.tr),unit=useW?" "+UNIT:(arr[0].timed?"s":" reps");
    const best=arr.reduce((b,a)=>{const s=a.sets.reduce((x,q)=>{const k=(parseFloat(q.w)||0)*1000+(+q.r||0);return k>x.k?{k,q}:x},{k:-1});return s.k>b.k?s:b},{k:-1}).q;
    const last=arr[arr.length-1];
    const mn=Math.min(...vals),mx=Math.max(...vals),sx=vals.length>1?100/(vals.length-1):0,sy=v=>mx===mn?20:34-(v-mn)/(mx-mn)*28;
    const pts=vals.map((v,i)=>`${5+i*sx},${sy(v)}`).join(" ");
    const lp=pts.split(" ").pop().split(",");
    const spark=vals.length>1?`<svg viewBox="0 0 110 40" aria-hidden="true"><polygon points="5,38 ${pts} ${lp[0]},38" fill="color-mix(in srgb,var(--blue) 18%,transparent)"/><polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/><circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="var(--blue)"/></svg>`:`<svg viewBox="0 0 110 40" aria-hidden="true"><circle cx="55" cy="20" r="3.5" fill="var(--blue)"/></svg>`;
    const fmt=q=>q?`${parseFloat(q.w)?toDisp(q.w)+" "+UNIT+" × ":""}${q.r||"-"}${timed(arr[0])||arr[0].timed?"s":""}`:"—";
    return `<div class="exp"><strong>${esc(n)}</strong><span class="muted">Best: ${fmt(best)} · top ${vals[vals.length-1]}${unit}</span><span class="muted">Last: ${fshort(last.d)} · ${last.sets.length} sets · ${arr.length} session${arr.length>1?"s":""}</span>${spark}</div>`}).join("");
  app.innerHTML=`<div class="eyebrow">Your training</div><h1>Progress</h1>
    <div class="stats"><div class="stat"><b>${ds.filter(d=>d>=mon).length}</b><span>this week</span></div><div class="stat"><b>${ds.filter(d=>d.startsWith(mk)).length}</b><span>this month</span></div><div class="stat"><b>${sets}</b><span>sets logged</span></div></div>
    ${weekSummary()}
    ${bwSection()}
    <h2 class="sec">Workouts per week</h2><div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Workouts per week, last 8 weeks">${bars}</svg></div>
    ${recSection(by)}
    <h2 class="sec">Exercises</h2><p class="muted" style="margin:-4px 0 10px">Line shows your top weight each session (or top reps for bodyweight moves).</p>
    ${exRows||`<div class="empty">Finish your first workout and your lifts will show up here.</div>`}`;
}



function weekSummary(){
  const mon=mondayOf(today());
  const calc=m=>{let w=0,sets=0,vol=0,time=0,planned=0;for(let i=0;i<7;i++){const d=addDays(m,i),x=S[d];if(planFor(d))planned++;if(started(x)){w++;x.ex.forEach(e=>e.sets.forEach(q=>{if(q.d){sets++;vol+=(parseFloat(q.w)||0)*(+q.r||0)}}));if(x.end)time+=x.end-x.start}}return {w,sets,vol,time,planned}};
  const cur=calc(mon),prev=calc(addDays(mon,-7));
  let streak=0;for(let k=1;k<104;k++){const c=calc(addDays(mon,-7*k));if(c.planned&&c.w>=c.planned)streak++;else break}
  const curMet=cur.planned&&cur.w>=cur.planned;if(curMet)streak++;
  const vd=v=>(UNIT==="lb"?Math.round(v*KG2LB):Math.round(v)).toLocaleString("en-US");
  const pct=prev.vol?Math.round((cur.vol-prev.vol)/prev.vol*100):null;
  return `<h2 class="sec">This week</h2><div class="stats" style="margin-top:0">
    <div class="stat"><b>${cur.w}/${cur.planned}</b><span>workouts</span></div>
    <div class="stat"><b>${vd(cur.vol)}</b><span>${UNIT} lifted${pct!==null?` · ${pct>0?"+":""}${pct}% vs last week`:""}</span></div>
    <div class="stat"><b>${cur.time?fmtDur(cur.time).replace(/:\d\d$/,""):"0:00"}</b><span>time trained</span></div></div>
    <p class="streak">${cur.sets} sets this week · ${streak?`🔥 <b>${streak} week${streak>1?"s":""}</b> in a row hitting your plan`:"Hit every planned workout this week to start a streak"}</p>`;
}

/* Apple Health (iPhone app only): read body-weight samples and fill the weight log automatically. */
const HK=(()=>{try{return window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Health}catch(e){return null}})();
let hkLast=store.get("c1-hklast",0),hkBusy=false,hkErr="";
const hkNote=()=>hkErr?`Apple Health: ${hkErr}`:hkLast?`Weight syncs from Apple Health automatically · last checked ${new Date(hkLast).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`:"Weight syncs from Apple Health automatically.";
async function hkSync(manual){
  if(!HK||hkBusy)return;if(!manual&&Date.now()-hkLast<10*60*1000)return;hkBusy=true;
  try{const av=await HK.isAvailable();if(!av.available)throw new Error(av.reason||"not available on this device");
    if(manual||!store.get("c1-hkasked",false)){await HK.requestAuthorization({read:["weight"]});store.set("c1-hkasked",true)}
    const r=await HK.readSamples({dataType:"weight",startDate:new Date(Date.now()-120*864e5).toISOString(),endDate:new Date().toISOString(),limit:500,ascending:true});
    const byDay={};(r.samples||[]).forEach(x=>{const kg=x.unit==="kilogram"?+x.value:(x.unit==="gram"?x.value/1000:+x.value);if(kg>20&&kg<400)byDay[ymd(new Date(x.startDate))]=Math.round(kg*10)/10});
    const before=bwLatest();let n=0;Object.entries(byDay).forEach(([d,kg])=>{if(BW[d]!==kg){BW[d]=kg;n++}});
    if(n)saveBW();hkErr="";hkLast=Date.now();store.set("c1-hklast",hkLast);
    if(manual)toast(n?`Synced ${n} weigh-in${n>1?"s":""} from Apple Health`:Object.keys(byDay).length?"Already up to date":"No weight found in Apple Health. Check Health → Sharing → Apps → C1 Workout");
    else if(n&&bwLatest()!==before)toast(`Weight updated from Apple Health: ${toDisp(bwLatest())} ${UNIT}`);
    if(n||manual)render()}
  catch(e){hkErr=(e&&e.message)||"couldn’t read";if(manual){toast("Apple Health: "+hkErr);render()}}
  finally{hkBusy=false}}

function recSection(by){

function initDrag(){let hold=null,drag=null,sx=0,sy=0,justDragged=false,scrollT=null;
  const rowAt=(x,y)=>{if(y==null)return null;let best=null,bd=1e9;document.querySelectorAll(".row[data-day]").forEach(r=>{if(drag&&r===drag.row)return;const b=r.getBoundingClientRect(),d=y<b.top?b.top-y:y>b.bottom?y-b.bottom:0;if(d<bd){bd=d;best=r}});return bd<=24?best:null};

  const end=(x,y,cancel)=>{clear();clearInterval(scrollT);if(!drag)return;const {row,card,from}=drag,t=cancel?null:rowAt(x,y);drag=null;document.body.classList.remove("dragging");
    card.style.transform="";row.classList.remove("lift");document.querySelectorAll(".row.dropto").forEach(r=>r.classList.remove("dropto"));
    justDragged=true;setTimeout(()=>justDragged=false,400);

  app.addEventListener("pointerdown",ev=>{const card=ev.target.closest(".row[data-day] .wcard");if(!card||ev.button>0)return;const row=card.closest(".row"),from=row.dataset.day;
    sx=ev.clientX;sy=ev.clientY;clear();

      drag={row,card,from,y0:sy,sc:window.scrollY};row.classList.add("lift");document.body.classList.add("dragging");try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}

  const move=(x,y)=>{if(!drag)return;drag.cx=x;drag.cy=y;drag.card.style.transform=`translateY(${y-drag.y0+window.scrollY-drag.sc}px) scale(1.03)`;
    const t=rowAt(x,y);document.querySelectorAll(".row.dropto").forEach(r=>{if(r!==t)r.classList.remove("dropto")});if(t&&t!==drag.row)t.classList.add("dropto")};

  if(left<=0&&!alerted){alerted=true;restDone()}else if(left>0&&left<=3&&lastBeep!==left){lastBeep=left;beep([660],.08,0,.35)}}

/* YouTube: take the 10 most relevant results for "<name> exercise form", then pick the one with the most views. */
async function ytBest(name){
  if(!YTKEY)throw new Error("Add a YouTube API key first.");
  const q=encodeURIComponent(`${name} exercise form`),k=encodeURIComponent(YTKEY);
  const sr=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&videoEmbeddable=true&q=${q}&key=${k}`),sj=await sr.json();
  if(!sr.ok)throw new Error((sj.error&&sj.error.message)||`YouTube search failed (${sr.status})`);
  const ids=(sj.items||[]).map(i=>i.id&&i.id.videoId).filter(Boolean);if(!ids.length)return null;
  const vr=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics,snippet&id=${ids.join(",")}&key=${k}`),vj=await vr.json();
  if(!vr.ok)throw new Error((vj.error&&vj.error.message)||`YouTube lookup failed (${vr.status})`);
  const best=(vj.items||[]).map(v=>({id:v.id,t:v.snippet.title,ch:v.snippet.channelTitle,views:+((v.statistics||{}).viewCount)||0})).sort((a,b)=>b.views-a.views)[0];
  return best?{v:`https://youtu.be/${best.id}`,vt:best.t,vch:best.ch,vv:best.views}:null}
const fmtViews=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+"M":n>=1e3?Math.round(n/1e3)+"K":String(n||0);
async function ytFill(list,quiet){
  if(!YTKEY||!list.length)return 0;ytBusy=true;let k=0,err="";
  for(let i=0;i<list.length;i++){const x=list[i];ytNote=`Finding videos… ${i+1} of ${list.length}`;if(location.hash==="#coach"&&!libEdit)render();
    try{const r=await ytBest(x.n);if(r){Object.assign(x,r);k++;saveLib()}}catch(e){err=e.message;break}}
  ytBusy=false;ytNote=err?`Stopped: ${err}`:"";if(location.hash.startsWith("#coach")&&!libEdit)render();
  if(!quiet||err)toast(err?"YouTube: "+err:`Added ${k} video${k===1?"":"s"}`);return k}

  if(!c){app.innerHTML=`<div class="wtop"><a class="back" href="#coach" aria-label="Back">←</a><div class="wt"><h1>Plan not found</h1></div></div>`;return}
  const missing=[...new Set(c.days.flatMap(d=>d.ex.map(e=>e.n.trim())).filter(n=>n&&!libFind(n)))];
  app.innerHTML=`<div class="wtop"><a class="back" href="#coach" aria-label="Back">←</a><div class="wt"><small>${esc(c.name||"Client plan")}</small><h1>${esc(c.client)}</h1></div></div>
    <p class="muted" style="margin:8px 0 4px">${esc(c.goal)} · ${esc(c.level)} · ${c.days.length} days/week · ~${esc(c.mins)} min · ${esc(c.equip)}</p>
    ${c.summary?`<p style="margin:0 0 12px">${esc(c.summary)}</p>`:""}
    <div class="rowbtns" style="margin-bottom:14px"><button type="button" class="btn primary" data-cshare="1">Share plan</button><button type="button" class="btn" data-ccopy="1">Copy text</button><button type="button" class="btn danger" data-cdel="1">Delete</button></div>
    ${c.days.map((d,di)=>`<section class="ex cday"><div class="cdh"><input class="ctitle" data-cd="${di}:title" value="${esc(d.title)}" aria-label="Day name"><button type="button" class="swapbtn" data-cdeld="${di}" aria-label="Remove ${esc(d.title)}">✕</button></div>
      <input class="cfocus" data-cd="${di}:focus" value="${esc(d.focus||"")}" placeholder="Focus" aria-label="Day focus">
      ${d.ex.map((e,ei)=>`<div class="cex"><div class="cexh"><span class="cnum">${ei+1}</span><input class="cname" data-cx="${di}:${ei}:n" value="${esc(e.n)}" list="libnames" aria-label="Exercise"><a class="vlink" href="${esc(exLink(e.n))}" target="_blank" rel="noopener" aria-label="Video for ${esc(e.n)}">▶</a><button type="button" class="xbtn" data-cdelx="${di}:${ei}" aria-label="Remove ${esc(e.n)}">✕</button></div>
        <div class="cexf"><label>Sets<input class="txt" inputmode="numeric" data-cx="${di}:${ei}:sets" value="${esc(e.sets)}"></label><label>Reps<input class="txt" data-cx="${di}:${ei}:reps" value="${esc(e.reps)}"></label><label>Rest<input class="txt" data-cx="${di}:${ei}:rest" value="${esc(e.rest)}"></label></div>
        <input class="cnote" data-cx="${di}:${ei}:note" value="${esc(e.note||"")}" placeholder="Coaching cue (optional)" aria-label="Coaching cue"></div>`).join("")}
      <button type="button" class="btn sm" data-caddx="${di}">＋ Add exercise</button></section>`).join("")}
    <datalist id="libnames">${LIB.map(x=>`<option value="${esc(x.n)}">`).join("")}</datalist>
    <button type="button" class="btn" data-caddd="1" style="width:100%;margin-bottom:14px">＋ Add a day</button>
    ${missing.length?`<div class="cform"><p style="margin:0"><b>${missing.length} exercise${missing.length>1?"s":""} not in your library:</b> <span class="muted">${missing.map(esc).join(", ")}</span></p><button type="button" class="btn sm" data-caddlib="1">Add them to my library</button></div>`:""}
    <label class="fl" style="margin-top:14px">Notes for the client<textarea class="txt note" rows="4" data-cnotes="1">${esc(c.notes||"")}</textarea></label>
    <div class="cform" style="margin-top:14px"><h3 class="csub">Ask Claude to change it</h3>
      <textarea class="txt note" rows="2" id="c-change" placeholder="e.g. Swap squats for leg press, add more glute work, make Day 2 shorter"></textarea>
      ${coachErr?`<p style="color:var(--red);margin:0">${esc(coachErr)}</p>`:""}
      <button type="button" class="btn primary" data-crevise="1"${coachBusy?" disabled":""}>${coachBusy?"Claude is updating the plan…":"✨ Update plan"}</button></div>`;
}

async function aiPlan(b,cur,change){
  const names=LIB.map(x=>`${x.n} (${x.m||"Other"}${x.eq?", "+x.eq:""})`).join("; ");
  const lib=LIB.length?(b.libonly?`Use ONLY exercises from this library, spelled exactly as written: ${names}.`:`Prefer exercises from the coach's library when they fit, spelled exactly as written: ${names}. Add other common exercises only when needed.`):"";
  const ask=cur?`Here is the current plan as JSON: ${JSON.stringify({name:cur.name,summary:cur.summary,days:cur.days.map(d=>({title:d.title,focus:d.focus,exercises:d.ex.map(e=>({name:e.n,muscle:e.m,sets:e.sets,reps:e.reps,rest:e.rest,note:e.note}))})),notes:cur.notes})}\nThe coach wants this change: "${change}". Apply it and keep everything else the same.`
    :`Write a weekly training plan for a client named "${b.name||"Client"}". Goal: ${b.goal}. Level: ${b.level}. ${b.days} training days per week, about ${b.mins} minutes per session. Equipment: ${b.equip}.${b.notes?` Notes from the coach (injuries, preferences): "${b.notes}".`:""} Make it safe, balanced and realistic for the level, with sensible exercise order (compound lifts first).`;
  const fmt=`Reply with JSON only, no other text: {"name":"short plan name","summary":"1-2 sentences about the approach","days":[{"title":"Day 1 · Upper body","focus":"short focus","exercises":[{"name":"Barbell bench press","muscle":"Chest","sets":3,"reps":"8–12","rest":"1:30","note":"short cue or empty"}]}],"notes":"2-4 short sentences on warm-up and how to progress"}. sets is a number, reps is text like "8–12" or "30 s", rest is m:ss. muscle is one of: ${MUSCLES.join(", ")}.`;
  const r=await callClaude([{type:"text",text:`You are an experienced, safety-minded strength coach.\n${ask}\n${lib}\n${fmt}`}],8000);
  if(!Array.isArray(r.days)||!r.days.length)throw new Error("Claude didn’t return a plan. Try again.");
  return {name:r.name||"Training plan",summary:r.summary||"",notes:r.notes||"",days:r.days.map(d=>({title:d.title||"Day",focus:d.focus||"",ex:(d.exercises||[]).map(e=>({n:String(e.name||"Exercise"),m:e.muscle||"",sets:+e.sets||3,reps:String(e.reps||"8–12"),rest:String(e.rest||"1:30"),note:e.note||""}))}))}
}
function planText(c){
  const L=[`💪 ${c.name||"Training plan"} · for ${c.client}`];if(c.summary)L.push(c.summary);
  L.push(`${c.goal} · ${c.level} · ${c.days.length} days/week · ~${c.mins} min · ${c.equip}`);
  c.days.forEach(d=>{L.push("",`${d.title.toUpperCase()}${d.focus?` (${d.focus})`:""}`);d.ex.forEach((e,i)=>{L.push(`${i+1}. ${e.n}: ${e.sets} × ${e.reps}${e.rest?` · rest ${e.rest}`:""}`);if(e.note)L.push(`   ↳ ${e.note}`);L.push(`   ▶ ${exLink(e.n)}`)})});
  if(c.notes)L.push("",`Notes: ${c.notes}`);return L.join("\n")}
async function coachGenerate(){
  if(!AIKEY){coachErr="Add your Claude API key in Food → ⚙ first.";return render()}
  coachBusy=true;coachErr="";render();
  try{const b={...cDraft,days:+cDraft.days,mins:+cDraft.mins},plan=await aiPlan(b);
    const c={id:uid(),created:today(),client:b.name.trim()||"Client",goal:b.goal,level:b.level,mins:b.mins,equip:b.equip,brief:b.notes,...plan};
    CLIENTS.unshift(c);saveCl();coachBusy=false;cDraft={...cDraft,name:"",notes:""};location.hash="#coach-p-"+c.id}
  catch(e){coachBusy=false;coachErr=e.message||"Something went wrong. Try again.";render()}}
async function coachRevise(c){
  const change=(document.getElementById("c-change")||{}).value||"";if(!change.trim()){toast("Type what Claude should change");return}
  if(!AIKEY){coachErr="Add your Claude API key in Food → ⚙ first.";return render()}
  coachBusy=true;coachErr="";render();
  try{const p=await aiPlan({...c,libonly:false},c,change.trim());Object.assign(c,p);saveCl();coachBusy=false;toast("Plan updated");render()}
  catch(e){coachBusy=false;coachErr=e.message||"Something went wrong. Try again.";render()}}

app.addEventListener("click",async ev=>{
  const q=s=>ev.target.closest(s);let b;
  if(!location.hash.startsWith("#coach"))return;
  const cid=location.hash.startsWith("#coach-p-")?location.hash.slice(9):null,c=cid&&CLIENTS.find(x=>x.id===cid);
  if(b=q("[data-ctab]")){coachTab=b.dataset.ctab;libEdit=null;return render()}
  if(b=q("[data-ladd]")){libEdit="new";render();const n=document.getElementById("l-n");if(n)n.focus();return}
  if(b=q("[data-ledit]")){libEdit=b.dataset.ledit;render();window.scrollTo(0,0);return}
  if(b=q("[data-lcancel]")){libEdit=null;libPick=null;return render()}
  if(b=q("[data-ldel]")){const x=LIB.find(e=>e.id===libEdit);if(x&&confirm(`Delete “${x.n}” from your library?`)){LIB=LIB.filter(e=>e.id!==libEdit);saveLib();libEdit=null;toast("Exercise deleted");render()}return}
  if(b=q("[data-lsave]")){const v=id=>document.getElementById(id).value.trim(),n=v("l-n");if(!n){toast("Give the exercise a name");return}
    const dup=libFind(n);if(dup&&dup.id!==libEdit){toast(`“${dup.n}” is already in your library`);return}
    const x={n,m:v("l-m"),eq:v("l-eq"),v:v("l-v"),note:v("l-note")};
    if(libPick&&libPick.v===x.v)Object.assign(x,libPick);else if(!x.v)Object.assign(x,{vt:"",vch:"",vv:0});
    let item;if(libEdit==="new"){item={id:uid(),...x};LIB.push(item)}else{item=LIB.find(e=>e.id===libEdit);if(item){const prev=item.v;Object.assign(item,x);if(prev!==x.v&&!(libPick&&libPick.v===x.v)){item.vt="";item.vch="";item.vv=0}}}
    libPick=null;LIB.sort((a,z)=>a.n.localeCompare(z.n));saveLib();libEdit=null;toast("Exercise saved");render();if(item&&!item.v&&YTKEY)ytFill([item],true);return}
  if(b=q("[data-ytsave]")){const v=document.getElementById("yt-key").value.trim();if(!v){toast("Paste your YouTube API key");return}YTKEY=v;store.set("c1-ytkey",YTKEY);toast("YouTube key saved");render();const miss=LIB.filter(x=>!x.v);if(miss.length)ytFill(miss);return}
  if(b=q("[data-ytall]")){if(!ytBusy)ytFill(LIB.filter(x=>!x.v));return}
  if(b=q("[data-ytone]")){const n=document.getElementById("l-n").value.trim();if(!n){toast("Type the exercise name first");return}b.disabled=true;b.textContent="Searching YouTube…";
    try{const r=await ytBest(n);if(!r){toast("No video found");b.disabled=false;b.textContent="▶ Find most-viewed video";return}document.getElementById("l-v").value=r.v;libPick=r;b.textContent=`▶ ${fmtViews(r.vv)} views · ${r.vt.slice(0,40)}`;b.disabled=false}catch(e){toast(e.message);b.disabled=false;b.textContent="▶ Find most-viewed video"}return}
  if(b=q("[data-cgen]"))return coachGenerate();
  if(!c)return;
  if(b=q("[data-crevise]"))return coachRevise(c);
  if(b=q("[data-cshare]")){const text=planText(c);try{if(navigator.share){await navigator.share({title:`${c.client}: ${c.name||"Training plan"}`,text});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(text);toast("Plan copied. Paste it into LINE or Messages")}catch(e){toast("Sharing isn’t available here")}return}
  if(b=q("[data-ccopy]")){try{await navigator.clipboard.writeText(planText(c));toast("Plan copied")}catch(e){toast("Copy isn’t allowed here")}return}
  if(b=q("[data-cdel]")){if(confirm(`Delete the plan for ${c.client}? This can’t be undone.`)){CLIENTS=CLIENTS.filter(x=>x!==c);saveCl();toast("Plan deleted");location.hash="#coach"}return}
  if(b=q("[data-cdelx]")){const [di,ei]=b.dataset.cdelx.split(":").map(Number);c.days[di].ex.splice(ei,1);saveCl();return render()}
  if(b=q("[data-caddx]")){c.days[+b.dataset.caddx].ex.push({n:"",m:"",sets:3,reps:"8–12",rest:"1:30",note:""});saveCl();render();const ins=document.querySelectorAll(`[data-cx^="${b.dataset.caddx}:"][data-cx$=":n"]`);if(ins.length)ins[ins.length-1].focus();return}
  if(b=q("[data-cdeld]")){const di=+b.dataset.cdeld;if(c.days.length<2){toast("Keep at least one day");return}if(confirm(`Remove ${c.days[di].title}?`)){c.days.splice(di,1);saveCl();render()}return}
  if(b=q("[data-caddd]")){c.days.push({title:`Day ${c.days.length+1}`,focus:"",ex:[]});saveCl();return render()}
  if(b=q("[data-caddlib]")){let k=0;c.days.forEach(d=>d.ex.forEach(e=>{const n=e.n.trim();if(n&&!libFind(n)){LIB.push({id:uid(),n,m:MUSCLES.includes(e.m)?e.m:"Other",eq:"",v:"",note:""});k++}}));LIB.sort((a,z)=>a.n.localeCompare(z.n));saveLib();toast(`Added ${k} exercise${k>1?"s":""} to your library`);render();if(YTKEY)ytFill(LIB.filter(x=>!x.v),true);return}
});
app.addEventListener("input",ev=>{
  if(!location.hash.startsWith("#coach"))return;const el=ev.target;
  if(el.id==="lib-q"){libQ=el.value;const pos=el.selectionStart;render();const n=document.getElementById("lib-q");if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(el.dataset.cdraft){cDraft[el.dataset.cdraft]=el.type==="checkbox"?el.checked:el.value;return}
  const c=CLIENTS.find(x=>"#coach-p-"+x.id===location.hash);if(!c)return;
  if(el.dataset.cx){const [di,ei,k]=el.dataset.cx.split(":");c.days[+di].ex[+ei][k]=k==="sets"?Math.max(1,parseInt(el.value)||1):el.value;saveCl();if(k==="n"){const a=el.parentElement.querySelector(".vlink");if(a)a.href=exLink(el.value)}}
  else if(el.dataset.cd){const [di,k]=el.dataset.cd.split(":");c.days[+di][k]=el.value;saveCl()}
  else if(el.dataset.cnotes){c.notes=el.value;saveCl()}
});
app.addEventListener("change",ev=>{if(location.hash==="#coach-new"&&ev.target.dataset.cdraft){const el=ev.target;cDraft[el.dataset.cdraft]=el.type==="checkbox"?el.checked:el.value}});

function render(){
  const h=location.hash.slice(1),tab=h.startsWith("w-")?"week":h.startsWith("coach")?"coach":(["calendar","progress","plan","food"].includes(h)?h:"week");
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===tab?"page":"false"));
  delete app.dataset.date;
  if(/^w-\d{4}-\d{2}-\d{2}$/.test(h))viewWorkout(h.slice(2));
  else if(h==="calendar")viewCal();
  else if(h==="progress")viewProgress();
  else if(h==="plan")viewPlan();
  else if(h==="food")viewFood();
  else if(h.startsWith("coach"))viewCoach(h);
  else viewWeek();
}
initDrag();
window.addEventListener("hashchange",()=>{closeSheet();FS=null;WS=null;rpeOpen=null;swapOpen=null;render();window.scrollTo(0,0)});
render();
</script>
